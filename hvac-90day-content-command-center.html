.post-note { font-size: 11.5px; color: #888; margin-top: 3px; font-weight: 400; }
.asset-bar {
  background: #f1efe8; border-top: 1px solid #e0ddd5;
  padding: 14px 24px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  position: fixed; bottom: 0; left: 0; right: 0;
}
.asset-label { font-size: 12px; color: #888; margin-right: 4px; }
.asset-btn {
  padding: 6px 14px; border-radius: 6px; border: 1px solid #d0cdc4;
  background: #fff; color: #1a1a1a; font-size: 12px;

.asset-btn:hover { background: #f5f3ee; }
.count-badge { font-size: 12px; color: #888; padding: 0 8px; margin-left: auto; }
.legend {
  display: flex; gap: 10px; flex-wrap: wrap; padding: 10px 24px;
  border-bottom: 1px solid #e8e5de; background: #faf8f4;
}
.leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #666; }
.leg-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

const tagLabels = {gap:"FH Furr gap",local:"Hyperlocal",heat:"Heat pump",trust:"Trust",hist:"Historic homes",review:"GBP post"};
const monthLabels = ["Month 1 — Capture & Credibility","Month 2 — Authority & Historic Niche","Month 3 — Dominance & Identity"];
const monthFocus = [
  "High-intent local capture. Own the urgent searches. Answer what nobody answers.",
  "Technical moat. Historic homes niche. The content that establishes you as the authority LLMs cite.",
  "Identity lock. Competitor separation. The 90-day close that makes you the answer — everywhere."
];

let current = 'all';

function setFilter(f, btn) {
  current = f;
  document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  render();
}

function render() {
  const list = document.getElementById('content-list');
  list.innerHTML = '';
  let shown = 0;

  for (let m = 1; m <= 3; m++) {
    const mPosts = posts.filter(p => p.m === m && (current === 'all' || p.tag === current));
    if (!mPosts.length) continue;

    const mb = document.createElement('div');
    mb.className = `month-block m${m}`;

    const hdr = document.createElement('div');
    hdr.className = 'month-hdr';
    hdr.innerHTML = `<div class="month-num">${m}</div><div><div class="month-label">${monthLabels[m-1]}</div><div class="month-focus">${monthFocus[m-1]}</div></div>`;
    mb.appendChild(hdr);

    const weeksInMonth = m === 1 ? [1,2,3,4] : m === 2 ? [5,6,7,8] : [9,10,11,12];
    weeksInMonth.forEach(w => {
      const wPosts = mPosts.filter(p => p.w === w);
      if (!wPosts.length) return;
      const ws = document.createElement('div');
      ws.className = 'week-section';
      ws.innerHTML = `<div class="week-tag">Week ${w}</div>`;
      wPosts.forEach(p => {
        shown++;
        const row = document.createElement('div');
        row.className = 'post-row';
        row.innerHTML = `<span class="tag-pill tag-${p.tag}">${tagLabels[p.tag]}</span><div><div class="post-title">${p.title}</div><div class="post-note">${p.note}</div></div>`;
        ws.appendChild(row);
      });
      mb.appendChild(ws);
    });

    list.appendChild(mb);
  }

  document.getElementById('count-badge').textContent = shown + ' posts';
}

render();
